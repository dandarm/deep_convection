    const videoEl = document.getElementById("mainVideo");
    const sliderEl = document.getElementById("frameSlider");
    const frameCounterEl = document.getElementById("frameCounter");
    const utcDisplayEl = document.getElementById("utcDisplay");
    const durationDisplayEl = document.getElementById("durationDisplay");
    const cacheAlertEl = document.getElementById("cacheAlert");
    const titleEl = document.getElementById("currentVideoTitle");
    const descEl = document.getElementById("eventDescription");
    const playPauseBtn = document.getElementById("btnPlayPause");
    const sidebarEl = document.getElementById("playlistSidebar");
    const ticksEl = document.getElementById("frameTicks");
    const speedSelectEl = document.getElementById("speedSelect");

    let currentSpec = VIDEOS[0];
    let isScrubbing = false;

    function formatFrameUtc(spec, frameIdx) {
      const t0 = new Date(spec.startUtc).getTime();
      const tCur = new Date(t0 + frameIdx * spec.stepMinutes * 60000);
      const yyyy = tCur.getUTCFullYear();
      const mm = String(tCur.getUTCMonth() + 1).padStart(2, "0");
      const dd = String(tCur.getUTCDate()).padStart(2, "0");
      const hh = String(tCur.getUTCHours()).padStart(2, "0");
      const mi = String(tCur.getUTCMinutes()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd} ${hh}:${mi} UTC`;
    }

    function buildSidebar() {
      sidebarEl.innerHTML = "";
      let lastSection = "";
      VIDEOS.forEach((v, idx) => {
        if (v.section !== lastSection) {
          lastSection = v.section;
          const secHdr = document.createElement("div");
          secHdr.className = "sidebar-section";
          secHdr.textContent = v.section;
          sidebarEl.appendChild(secHdr);
        }
        const btn = document.createElement("button");
        btn.className = "video-btn" + (idx === 0 ? " active" : "");
        btn.dataset.id = v.id;
        btn.innerHTML = `<span class="v-title">${v.title}</span><span class="v-meta">${v.meta}</span>`;
        btn.addEventListener("click", () => loadVideo(v));
        sidebarEl.appendChild(btn);
      });
    }

    function buildTicks(numFrames) {
      ticksEl.innerHTML = "";
      const steps = Math.min(numFrames, 12);
      for (let i = 0; i < steps; i++) {
        const fIdx = Math.round((i * (numFrames - 1)) / Math.max(1, steps - 1));
        const sp = document.createElement("span");
        sp.textContent = `F${fIdx + 1}`;
        ticksEl.appendChild(sp);
      }
    }

    function updateUiForFrame(frameIdx) {
      const clamped = Math.max(0, Math.min(currentSpec.numFrames - 1, frameIdx));
      if (!isScrubbing) {
        sliderEl.value = clamped;
      }
      frameCounterEl.textContent = `Frame: ${clamped + 1} / ${currentSpec.numFrames}`;
      utcDisplayEl.textContent = formatFrameUtc(currentSpec, clamped);
    }

    function seekToFrame(frameIdx) {
      const clamped = Math.max(0, Math.min(currentSpec.numFrames - 1, frameIdx));
      videoEl.pause();
      updatePlayButton();
      videoEl.currentTime = (clamped + 0.05) / currentSpec.fps;
      updateUiForFrame(clamped);
    }

    function currentFrameIndex() {
      return Math.min(
        currentSpec.numFrames - 1,
        Math.max(0, Math.floor(videoEl.currentTime * currentSpec.fps + 0.001))
      );
    }

    function updatePlayButton() {
      playPauseBtn.textContent = videoEl.paused ? "▶ Play" : "⏸ Pausa";
    }

    function loadVideo(spec) {
      currentSpec = spec;
      document.querySelectorAll(".video-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.id === spec.id);
      });
      titleEl.textContent = spec.title;
      descEl.textContent = spec.meta;
      sliderEl.max = spec.numFrames - 1;
      sliderEl.value = 0;
      buildTicks(spec.numFrames);

      cacheAlertEl.style.display = "none";
      videoEl.src = spec.src;
      videoEl.playbackRate = parseFloat(speedSelectEl.value);
      videoEl.currentTime = 0;
      updateUiForFrame(0);
      updatePlayButton();
    }

    // Video duration and cache sanity check on loadedmetadata
    videoEl.addEventListener("loadedmetadata", () => {
      const actualDur = videoEl.duration;
      const expectedDur = currentSpec.numFrames / currentSpec.fps;
      if (durationDisplayEl && isFinite(actualDur)) {
        durationDisplayEl.textContent = `Durata: ${actualDur.toFixed(1)}s (${currentSpec.numFrames} frame @ ${currentSpec.fps} fps)`;
      }
      if (isFinite(actualDur) && actualDur < (expectedDur - 3.0)) {
        cacheAlertEl.style.display = "block";
        cacheAlertEl.innerHTML = `⚠️ <strong>Attenzione Cache Browser:</strong> Il browser ha caricato una versione precedente da <strong>${actualDur.toFixed(1)}s</strong> invece del file aggiornato da <strong>${expectedDur.toFixed(1)}s</strong> (${currentSpec.numFrames} frame).<br>Per visualizzare l'intera sequenza lunga, premi <strong>Ctrl + F5</strong> (oppure Shift + F5 / ricarica forzata).`;
      } else {
        cacheAlertEl.style.display = "none";
      }
    });

    // Slider scrubbing events (instant frame seek on click or drag)
    sliderEl.addEventListener("mousedown", () => { isScrubbing = true; videoEl.pause(); updatePlayButton(); });
    sliderEl.addEventListener("mouseup", () => { isScrubbing = false; });
    sliderEl.addEventListener("input", () => {
      const targetFrame = parseInt(sliderEl.value, 10);
      videoEl.pause();
      updatePlayButton();
      videoEl.currentTime = (targetFrame + 0.05) / currentSpec.fps;
      frameCounterEl.textContent = `Frame: ${targetFrame + 1} / ${currentSpec.numFrames}`;
      utcDisplayEl.textContent = formatFrameUtc(currentSpec, targetFrame);
    });
    sliderEl.addEventListener("change", () => {
      isScrubbing = false;
      const targetFrame = parseInt(sliderEl.value, 10);
      seekToFrame(targetFrame);
    });

    window.addEventListener("mouseup", () => {
      if (isScrubbing) {
        isScrubbing = false;
      }
    });

    videoEl.addEventListener("timeupdate", () => {
      if (!isScrubbing) {
        updateUiForFrame(currentFrameIndex());
      }
    });
    videoEl.addEventListener("play", updatePlayButton);
    videoEl.addEventListener("pause", updatePlayButton);

    // Button controls
    playPauseBtn.addEventListener("click", () => {
      if (videoEl.paused) {
        videoEl.play();
      } else {
        videoEl.pause();
      }
    });
    document.getElementById("btnPrev").addEventListener("click", () => {
      seekToFrame(currentFrameIndex() - 1);
    });
    document.getElementById("btnNext").addEventListener("click", () => {
      seekToFrame(currentFrameIndex() + 1);
    });
    document.getElementById("btnFirst").addEventListener("click", () => {
      seekToFrame(0);
    });
    document.getElementById("btnLast").addEventListener("click", () => {
      seekToFrame(currentSpec.numFrames - 1);
    });
    speedSelectEl.addEventListener("change", () => {
      videoEl.playbackRate = parseFloat(speedSelectEl.value);
    });
    document.getElementById("btnFullscreen").addEventListener("click", () => {
      if (videoEl.requestFullscreen) {
        videoEl.requestFullscreen();
      }
    });

    // Keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight" && e.key !== " ") return;
      }
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        seekToFrame(currentFrameIndex() - 1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        seekToFrame(currentFrameIndex() + 1);
      } else if (e.key === " ") {
        e.preventDefault();
        if (videoEl.paused) videoEl.play(); else videoEl.pause();
      } else if (e.key === "Home") {
        e.preventDefault();
        seekToFrame(0);
      } else if (e.key === "End") {
        e.preventDefault();
        seekToFrame(currentSpec.numFrames - 1);
      }
    });

    buildSidebar();
    loadVideo(VIDEOS[0]);
  </script>
</body>
</html>
